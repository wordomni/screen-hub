<!DOCTYPE html>
<html>
<head>
<title>White Screen Tool</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>White Screen Tool</h1>

<button onclick="goWhite()">Start</button>

<div id="screen"></div>

<script>
function goWhite() {
  document.body.style.background = "white";
  document.body.style.color = "black";
}
</script>

</body>
</html>
