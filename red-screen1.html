<!DOCTYPE html>
<html>
<head>
<title>Red Screen Tool</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>White Screen Tool</h1>

<button onclick="goRed()">Start</button>

<div id="screen"></div>

<script>
function goRed() {
  document.body.style.background = "red";
  document.body.style.color = "red";
}
</script>

</body>
</html>
