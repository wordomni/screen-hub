<!DOCTYPE html>
<html>
<head>
<title>Black Screen Tool</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Black Screen Tool</h1>

<button onclick="goBlack()">Start</button>

<script>
function goBlack() {
  document.body.style.background = "black";
  document.body.style.color = "white";
}
</script>

</body>
</html>
